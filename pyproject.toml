[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garage-admin-panel"
version = "2.1.0"
description = "A dependency-free, authenticated web control panel for Garage S3."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["garage", "s3", "administration", "self-hosted"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/jr551/garage-admin-panel"
Issues = "https://github.com/jr551/garage-admin-panel/issues"
Changelog = "https://github.com/jr551/garage-admin-panel/blob/main/CHANGELOG.md"

[project.scripts]
garage-admin-panel = "garage_panel:main"

[tool.setuptools]
py-modules = ["garage_panel"]
include-package-data = true

[tool.setuptools.data-files]
"share/garage-admin-panel/static" = [
  "static/swagger-ui-bundle.js",
  "static/swagger-ui.css",
]
